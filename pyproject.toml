[project]
name = "arc-connector"
version = "0.1.0"
description = "Pull feature and imagery data from ArcGIS Online to local files."
requires-python = ">=3.10"
dependencies = [
    "arcgis>=2.3.0",
    "pyyaml>=6.0",
    "pyshp>=2.3.1",
    "pyproj>=3.6",
]

[project.scripts]
arc-connector = "arc_connector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
